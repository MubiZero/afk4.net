server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Coolify-managed Traefik handles TLS and host routing (see deploy/coolify/ingress.md).
    # This server only serves the Organization Admin static bundle; the platform API lives on
    # its own host and is reached by the browser directly.

    # SPA history fallback: any unknown path returns index.html so the client router resolves it.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # Vite hashes asset filenames; they are safe to cache aggressively.
    location /assets/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        default_type text/plain;
    }
}
