<!doctype html>
<html lang="ru" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Панель AFK4.NET</title>
    <script>
      // No-flash theme init: set data-theme before the first frame so the dark dashboard
      // doesn't flash an unstyled/wrong-theme frame before React mounts. Default dark
      // (cyber-club night context); explicit choice from localStorage wins. Key mirrors
      // STORAGE_KEY in operatorTheme.tsx.
      (function () {
        try {
          var stored = localStorage.getItem('afk4.organization-admin.theme');
          document.documentElement.setAttribute(
            'data-theme',
            stored === 'light' || stored === 'dark' ? stored : 'dark',
          );
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
    <style>
      /* Экран загрузки — до первого кадра React. На слабом кассовом ПК разбор кода Панели занимает
         секунды, и всё это время окно стояло чёрным (приёмка в VM 26.10.2026). React заменяет
         содержимое #root первым же рендером. */
      .boot { display: grid; place-items: center; height: 100vh; margin: 0; font: 600 15px/1.4 system-ui, 'Segoe UI', sans-serif; }
      html[data-theme='dark'] .boot { background: #0e1117; color: #aab4c2; }
      html[data-theme='light'] .boot { background: #f5f7fa; color: #4b5563; }
      .boot-inner { display: grid; justify-items: center; gap: 16px; }
      .boot-spinner { width: 28px; height: 28px; border: 3px solid currentColor; border-right-color: transparent; border-radius: 50%; opacity: 0.6; animation: boot-spin 0.9s linear infinite; }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .boot-spinner { animation: none; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot" role="status" aria-live="polite">
        <div class="boot-inner">
          <div class="boot-spinner" aria-hidden="true"></div>
          <span id="boot-text">Загружаем Панель AFK4.NET…</span>
        </div>
      </div>
    </div>
    <script>
      // Язык — тот, что выбран в прошлый раз (ключ тот же, что у @afk4/i18n).
      (function () {
        try {
          var text = { tg: 'Панели AFK4.NET бор мешавад…', en: 'Loading AFK4.NET Panel…' }[localStorage.getItem('afk4.locale')];
          if (text) document.getElementById('boot-text').textContent = text;
        } catch (e) {}
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
