<!doctype html>
<html lang="ru" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AFK4.NET · Мастер установки</title>
    <script>
      // No-flash theme init: ставим data-theme до первого кадра, чтобы не мигало
      // светлым перед монтированием React. Дефолт — dark; явный выбор из localStorage выше.
      // Ключ зеркалит THEME_STORAGE_KEY из App.tsx.
      (function () {
        try {
          var stored = localStorage.getItem('afk4.setupWizard.theme');
          document.documentElement.setAttribute(
            'data-theme',
            stored === 'light' || stored === 'dark' ? stored : 'dark',
          );
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
    <style>
      /* Экран загрузки — до первого кадра React: на слабом ПК разбор кода занимает секунды, и окно
         стояло пустым (приёмка в VM 26.10.2026). React заменяет содержимое #root первым рендером. */
      .boot { display: grid; place-items: center; height: 100vh; margin: 0; font: 600 15px/1.4 system-ui, 'Segoe UI', sans-serif; background: #0e1117; color: #aab4c2; }
      html[data-theme='light'] .boot { background: #f5f7fa; color: #4b5563; }
      .boot-inner { display: grid; justify-items: center; gap: 16px; }
      .boot-spinner { width: 28px; height: 28px; border: 3px solid currentColor; border-right-color: transparent; border-radius: 50%; opacity: 0.6; animation: boot-spin 0.9s linear infinite; }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .boot-spinner { animation: none; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot" role="status" aria-live="polite">
        <div class="boot-inner">
          <div class="boot-spinner" aria-hidden="true"></div>
          <span id="boot-text">Загружаем мастер установки…</span>
        </div>
      </div>
    </div>
    <script>
      (function () {
        try {
          var text = { tg: 'Устоди насб бор мешавад…', en: 'Loading the setup wizard…' }[localStorage.getItem('afk4.locale')];
          if (text) document.getElementById('boot-text').textContent = text;
        } catch (e) {}
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
