<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>AFK4.NET Operator</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- DEV-ONLY host-bridge stub (working-tree only, do not commit).
         Emulates the native WebView2 auth bridge so the operator UI can sign in
         from a plain browser against the staging API (proxied by vite). -->
    <script>
      (function () {
        var ORG = '0169044b-2f74-46a7-8e52-7656a39a8f8c';
        var BRANCH = 'f77b708c-1dc9-4cb3-9c19-21797f7035fc';
        window.__AFK4_OPERATOR_CONFIG__ = {
          runtime: 'browser-dev',
          shellMode: 'vite-dev',
          platformBaseUrl: location.origin + '/',
          currencyCode: 'TJS',
          organizationId: ORG,
          branchId: BRANCH
        };
        var listeners = new Set();
        var refreshToken = null;
        function emit(requestId, ok, payload, error) {
          var ev = { data: { type: 'host:response', requestId: requestId, ok: ok, payload: payload, error: error } };
          listeners.forEach(function (l) { try { l(ev); } catch (e) {} });
        }
        function toSession(r) {
          if (r && r.refreshToken) { refreshToken = r.refreshToken; }
          return {
            staffUserId: r.staffUserId,
            organizationId: r.organizationId,
            displayName: r.displayName,
            accessToken: r.accessToken,
            accessTokenExpiresAtUtc: r.accessTokenExpiresAtUtc,
            refreshTokenExpiresAtUtc: r.refreshTokenExpiresAtUtc,
            branchIds: r.branchIds,
            activeBranchId: (r.branchIds && r.branchIds[0]) || undefined,
            permissions: r.permissions
          };
        }
        async function handle(type, payload) {
          if (type === 'auth:loadToken') { return null; }
          if (type === 'auth:signOut') { refreshToken = null; return { signedOut: true }; }
          if (type === 'auth:signIn') {
            var body = {
              organizationId: (payload && payload.organizationId) || ORG,
              userName: payload && payload.userName,
              password: payload && payload.password
            };
            var res = await fetch('/api/auth/staff/sign-in', {
              method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body)
            });
            if (!res.ok) { throw { code: 'sign_in_failed', message: 'HTTP ' + res.status }; }
            return toSession(await res.json());
          }
          if (type === 'auth:refresh') {
            var res = await fetch('/api/auth/staff/refresh', {
              method: 'POST', headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ organizationId: ORG, refreshToken: refreshToken })
            });
            if (!res.ok) { throw { code: 'refresh_failed', message: 'HTTP ' + res.status }; }
            return toSession(await res.json());
          }
          throw { code: 'unhandled', message: 'dev bridge: unhandled ' + type };
        }
        window.chrome = window.chrome || {};
        window.chrome.webview = {
          postMessage: function (msg) {
            if (!msg || !msg.type) { return; }
            if (msg.type.indexOf('window:') === 0) { return; } // native window chrome — no-op in browser
            Promise.resolve().then(function () { return handle(msg.type, msg.payload); })
              .then(function (payload) { emit(msg.requestId, true, payload); })
              .catch(function (err) {
                emit(msg.requestId, false, undefined, {
                  code: (err && err.code) || 'host_error',
                  message: (err && err.message) || String(err)
                });
              });
          },
          addEventListener: function (t, l) { if (t === 'message') { listeners.add(l); } },
          removeEventListener: function (t, l) { if (t === 'message') { listeners.delete(l); } }
        };
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
