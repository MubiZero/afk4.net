name: Demo Panel

# Демо-Панель и демо экрана игрока на примерах данных (docs/operations/demo-panel.md) — на GitHub
# Pages: статика без сервера, мимо общей очереди деплоев Coolify. Панель лежит в корне сайта, экран
# игрока — в /shell/, оба уходят одним артефактом. Пересобирается с каждой правкой любого из двух
# приложений (или общих пакетов и строк) в main.
on:
  push:
    branches: [main]
    paths:
      - src/AFK4.OrganizationAdmin.Web/**
      - src/AFK4.Player.Shell.Web/**
      - packages/**
      - locales/**
      - .github/workflows/demo-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: demo-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install
        run: bun install --frozen-lockfile

      - name: Build the Panel demo
        working-directory: src/AFK4.OrganizationAdmin.Web
        run: bun run build:demo

      - name: Build the Player Shell demo
        working-directory: src/AFK4.Player.Shell.Web
        run: bun run build:demo

      # Один сайт: Панель в корне, экран игрока в /shell/. Ссылки между ними относительные
      # («./shell/» из Панели, «../» из экрана игрока), поэтому сайт не привязан к домену.
      # Своё имя сайта: без файла CNAME Pages после каждой выкладки сбрасывал бы его.
      - name: Assemble the site
        run: |
          mkdir -p site/shell
          cp -R src/AFK4.OrganizationAdmin.Web/dist-demo/. site/
          cp -R src/AFK4.Player.Shell.Web/dist-demo/. site/shell/
          echo "demo.afk4.net" > site/CNAME

      - name: Upload
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
