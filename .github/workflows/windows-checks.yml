name: Windows Checks On Demand

# Windows-часть по требованию, с любой ветки и без открытия PR.
#
# Зачем отдельно от pr-verification: на macOS оболочки нельзя ни запустить, ни толком собрать, и
# единственный способ увидеть их красное — Windows-раннер. Ждать ради этого весь набор ворот PR
# незачем: здесь идёт ровно то, чего локальный прогон (scripts/verify.sh) не покрывает, и
# поэтому это минуты, а не десять минут.
#
# Запуск: gh workflow run windows-checks.yml --ref <ветка>
# Или дорожкой локальных ворот: scripts/verify.sh windows (без AFK4_WINDOWS_HOST).
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  windows-checks:
    name: Build And Test Windows Parts
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore AFK4.sln

      # Собирается решение целиком: WPF здесь собирается по-настоящему, а не через
      # EnableWindowsTargeting, которым обходятся на macOS.
      - name: Build
        run: dotnet build AFK4.sln --no-restore -p:NuGetAudit=false -p:UseSharedCompilation=false -v minimal

      # Только то, чего не гоняет локальный прогон: наборы оболочек целиком и два набора, где
      # часть тестов помечена WindowsOnly и вне Windows сообщается пропущенной.
      # По одному проекту за раз: `dotnet test` принимает ровно один — перечисленные подряд
      # уезжают в MSBuild как несколько проектов, и он отказывается.
      - name: Test Windows-only parts
        run: |
          $projects = @(
            'tests/AFK4.OrganizationAdmin.App.Tests',
            'tests/AFK4.Player.Shell.Tests',
            'tests/AFK4.Agent.Service.Tests',
            'tests/AFK4.SetupWizard.Tests'
          )
          foreach ($project in $projects) {
            Write-Host "::group::test $project"
            dotnet test $project --no-build -p:NuGetAudit=false -v minimal
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Write-Host "::endgroup::"
          }
