name: PR Verification

# Every pull request is verified, not only those targeting main: work that lands on a long-lived
# design branch first would otherwise reach main having never been checked.
on:
  pull_request:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: pr-verification-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Relevant Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_dotnet: ${{ steps.filter.outputs.run_dotnet }}
      run_web: ${{ steps.filter.outputs.run_web }}
      run_flutter: ${{ steps.filter.outputs.run_flutter }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect relevant changes
        id: filter
        shell: pwsh
        run: |
          $base = "${{ github.event.pull_request.base.sha }}"
          $head = "${{ github.event.pull_request.head.sha }}"
          $changed = git diff --name-only "$base...$head"
          $relevantPrefixes = @(
            ".github/workflows/",
            "deploy/",
            "installers/",
            "scripts/",
            "src/",
            "tests/"
          )
          $relevantFiles = @(
            "AFK4.sln",
            ".config/dotnet-tools.json",
            "Directory.Build.props",
            "Directory.Packages.props",
            "global.json",
            "NuGet.config"
          )
          $webPrefixes = @(
            ".github/workflows/pr-verification.yml",
            "packages/",
            "src/AFK4.PlatformControl.Web/",
            "src/AFK4.OrganizationAdmin.Web/",
            "src/AFK4.SetupWizard.Web/",
            "src/AFK4.Player.Shell.Web/"
          )
          $flutterPrefixes = @(
            ".github/workflows/pr-verification.yml",
            "locales/",
            "packages/i18n/",
            "src/afk4_customer_app/"
          )
          $webFiles = @(
            "package.json",
            "bun.lock",
            "bunfig.toml"
          )
          $runDotnet = $false
          $runWeb = $false
          $runFlutter = $false

          foreach ($path in $changed) {
            if ($relevantFiles -contains $path) {
              $runDotnet = $true
            }
            foreach ($prefix in $relevantPrefixes) {
              if ($path.StartsWith($prefix, [System.StringComparison]::OrdinalIgnoreCase)) {
                $runDotnet = $true
              }
            }

            if ($webFiles -contains $path) {
              $runWeb = $true
            }
            foreach ($prefix in $webPrefixes) {
              if ($path.StartsWith($prefix, [System.StringComparison]::OrdinalIgnoreCase)) {
                $runWeb = $true
              }
            }

            foreach ($prefix in $flutterPrefixes) {
              if ($path.StartsWith($prefix, [System.StringComparison]::OrdinalIgnoreCase)) {
                $runFlutter = $true
              }
            }

            if ($runDotnet -and $runWeb -and $runFlutter) {
              break
            }
          }

          Write-Host "Changed paths:"
          $changed | ForEach-Object { Write-Host " - $_" }
          Write-Host "Run .NET build/test: $runDotnet"
          Write-Host "Run web build/test: $runWeb"
          Write-Host "Run Flutter build/test: $runFlutter"
          "run_dotnet=$($runDotnet.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "run_web=$($runWeb.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "run_flutter=$($runFlutter.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

  build-test-windows:
    name: Build And Test Windows
    needs: changes
    if: ${{ needs.changes.outputs.run_dotnet == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore tools
        run: dotnet tool restore

      - name: Restore
        run: dotnet restore AFK4.sln

      - name: Build
        run: dotnet build AFK4.sln --no-restore -p:NuGetAudit=false -p:UseSharedCompilation=false -v minimal

      - name: Test
        run: dotnet test AFK4.sln --no-build -p:NuGetAudit=false -p:UseSharedCompilation=false -v minimal

  # The Windows job above cannot host this: GitHub service containers are Linux-only, so the
  # Postgres-backed tests would skip themselves there — which is exactly what used to happen.
  # Linux is also where the API actually runs in production.
  test-postgres:
    name: Test Against PostgreSQL
    needs: changes
    if: ${{ needs.changes.outputs.run_dotnet == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        # Throwaway credentials for a container reachable only from this runner; the production
        # database is configured elsewhere and shares nothing with it.
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: afk4_ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # Every suite isolates itself in its own generated schema, so one database serves them all.
      # The name must end in _test: each attribute refuses to touch a database that is not marked
      # disposable.
      AFK4_POS_POSTGRES_TEST_CONNECTION_STRING: Host=127.0.0.1;Port=5432;Database=afk4_ci_test;Username=postgres;Password=postgres
      AFK4_RESERVATION_POSTGRES_TEST_CONNECTION_STRING: Host=127.0.0.1;Port=5432;Database=afk4_ci_test;Username=postgres;Password=postgres
      AFK4_COMMERCE_TEST_POSTGRES: Host=127.0.0.1;Port=5432;Database=afk4_ci_test;Username=postgres;Password=postgres
      AFK4_PLATFORM_ADMIN_POSTGRES_TEST_CONNECTION_STRING: Host=127.0.0.1;Port=5432;Database=afk4_ci_test;Username=postgres;Password=postgres
      # Turns a broken database configuration into a red build instead of a green one full of
      # skipped tests. See PostgresTestAvailabilityTests.
      AFK4_REQUIRE_POSTGRES_TESTS: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # Only the API test project: the solution also carries WPF projects, which do not build off Windows.
      - name: Test
        run: dotnet test tests/AFK4.Platform.Api.Tests -p:NuGetAudit=false -v minimal

  build-test-web:
    name: Build And Test Web
    needs: changes
    if: ${{ needs.changes.outputs.run_web == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # bun's --filter does not match the src/AFK4.*.Web workspaces, so iterate
      # the workspace dirs explicitly; each runs in its own dir to pick up its bunfig.
      # The list must hold every workspace with a `test` script — a workspace missing here is
      # not "not covered yet", it is a suite that goes red without anyone finding out.
      # Линтер ловит то, что не ловят ни тесты, ни сборка: мёртвые импорты и переменные,
      # перекрытые глобальные имена, `==` вместо `===`. Набор правил намеренно узкий — см.
      # biome.json: правило, которое кричит на здоровый код, скоро начинают игнорировать.
      - name: Lint web workspaces
        run: bun run lint

      - name: Test web workspaces
        run: |
          set -e
          for dir in \
            packages/formatting packages/i18n packages/money \
            packages/tokens packages/ui \
            src/AFK4.PlatformControl.Web src/AFK4.OrganizationAdmin.Web \
            src/AFK4.SetupWizard.Web \
            src/AFK4.Player.Shell.Web; do
            echo "::group::test $dir"
            # Run each workspace's own `test` script, not a bare `bun test`: Organization Admin
            # splits App.test into its own bun process to dodge bun's cross-file mock.module leak
            # (see #88). A bare `bun test` here ran every file in one process and reintroduced the
            # flake; `bun run test` honours that isolation. Other workspaces' `test` == `bun test`.
            (cd "$dir" && bun run test)
            echo "::endgroup::"
          done

      - name: Build web apps
        run: |
          set -e
          for dir in \
            src/AFK4.PlatformControl.Web src/AFK4.OrganizationAdmin.Web \
            src/AFK4.SetupWizard.Web \
            src/AFK4.Player.Shell.Web; do
            echo "::group::build $dir"
            (cd "$dir" && bun run build)
            echo "::endgroup::"
          done

  build-test-flutter:
    name: Build And Test Flutter
    needs: changes
    if: ${{ needs.changes.outputs.run_flutter == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.6
          channel: stable
          cache: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # ARB рождаются из locales/*.json тем же генератором, что и messages.ts. Перегенерируем
      # и требуем чистого дерева: правка каталога без перегенерации иначе доедет до магазина
      # как молча устаревший перевод.
      - name: Verify generated localization is current
        run: |
          set -e
          (cd packages/i18n && bun run gen)
          git diff --exit-code -- locales src/afk4_customer_app/lib/l10n packages/i18n/src

      # `flutter pub get` сам генерирует классы локализации из .arb (generate: true),
      # поэтому отдельного шага gen-l10n не нужно.
      - name: Analyze and test
        run: |
          set -e
          cd src/afk4_customer_app
          flutter pub get
          flutter analyze
          flutter test

      # Сквозной сценарий поднимает приложение целиком и подменяет только сервер. Идёт на
      # flutter-tester: без `-d` инструмент ищет подключённое устройство, которого на раннере
      # нет, и `integration_test/` в обычный `flutter test` не попадает.
      - name: End-to-end journey
        run: |
          set -e
          cd src/afk4_customer_app
          flutter test integration_test -d flutter-tester

      - name: Build web
        run: |
          set -e
          cd src/afk4_customer_app
          flutter build web --release

  pr-verification-result:
    name: PR Verification Result
    needs:
      - changes
      - build-test-windows
      - test-postgres
      - build-test-web
      - build-test-flutter
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check result
        shell: pwsh
        run: |
          $changesResult = "${{ needs.changes.result }}"
          $runDotnet = "${{ needs.changes.outputs.run_dotnet }}"
          $windowsResult = "${{ needs.build-test-windows.result }}"
          $postgresResult = "${{ needs.test-postgres.result }}"
          $runWeb = "${{ needs.changes.outputs.run_web }}"
          $webResult = "${{ needs.build-test-web.result }}"
          $runFlutter = "${{ needs.changes.outputs.run_flutter }}"
          $flutterResult = "${{ needs.build-test-flutter.result }}"

          if ($changesResult -ne "success") {
            throw "Change detection failed. Result: $changesResult"
          }

          if ($runDotnet -eq "true" -and $windowsResult -ne "success") {
            throw "Windows build/test gate did not pass. Result: $windowsResult"
          }

          if ($runDotnet -eq "true" -and $postgresResult -ne "success") {
            throw "PostgreSQL test gate did not pass. Result: $postgresResult"
          }

          if ($runWeb -eq "true" -and $webResult -ne "success") {
            throw "Web build/test gate did not pass. Result: $webResult"
          }

          if ($runFlutter -eq "true" -and $flutterResult -ne "success") {
            throw "Flutter build/test gate did not pass. Result: $flutterResult"
          }

          if ($runDotnet -ne "true") {
            Write-Host "No .NET-relevant changes detected; skipping the paid Windows runner and the PostgreSQL job."
          }
          else {
            Write-Host "Windows build/test and PostgreSQL gates passed."
          }

          if ($runWeb -ne "true") {
            Write-Host "No web-relevant changes detected; skipping web checks."
          }
          else {
            Write-Host "Web build/test gate passed."
          }

          if ($runFlutter -ne "true") {
            Write-Host "No Flutter-relevant changes detected; skipping Flutter checks."
          }
          else {
            Write-Host "Flutter build/test gate passed."
          }
