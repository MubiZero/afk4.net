name: PR Verification

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: pr-verification-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Relevant Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_windows: ${{ steps.filter.outputs.run_windows }}
      run_web: ${{ steps.filter.outputs.run_web }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect relevant changes
        id: filter
        shell: pwsh
        run: |
          $base = "${{ github.event.pull_request.base.sha }}"
          $head = "${{ github.event.pull_request.head.sha }}"
          $changed = git diff --name-only "$base...$head"
          $relevantPrefixes = @(
            ".github/workflows/",
            "installers/",
            "scripts/",
            "src/",
            "tests/"
          )
          $relevantFiles = @(
            "AFK4.sln",
            ".config/dotnet-tools.json",
            "Directory.Build.props",
            "Directory.Packages.props",
            "global.json",
            "NuGet.config"
          )
          $webPrefixes = @(
            ".github/workflows/pr-verification.yml",
            "packages/",
            "src/AFK4.Platform.Web/",
            "src/AFK4.Operator.App.Web/",
            "src/AFK4.Customer.Web/",
            "src/AFK4.SetupWizard.Web/"
          )
          $webFiles = @(
            "package.json",
            "bun.lock",
            "bunfig.toml"
          )
          $runWindows = $false
          $runWeb = $false

          foreach ($path in $changed) {
            if ($relevantFiles -contains $path) {
              $runWindows = $true
            }
            foreach ($prefix in $relevantPrefixes) {
              if ($path.StartsWith($prefix, [System.StringComparison]::OrdinalIgnoreCase)) {
                $runWindows = $true
              }
            }

            if ($webFiles -contains $path) {
              $runWeb = $true
            }
            foreach ($prefix in $webPrefixes) {
              if ($path.StartsWith($prefix, [System.StringComparison]::OrdinalIgnoreCase)) {
                $runWeb = $true
              }
            }

            if ($runWindows -and $runWeb) {
              break
            }
          }

          Write-Host "Changed paths:"
          $changed | ForEach-Object { Write-Host " - $_" }
          Write-Host "Run Windows build/test: $runWindows"
          Write-Host "Run web build/test: $runWeb"
          "run_windows=$($runWindows.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "run_web=$($runWeb.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

  build-test-windows:
    name: Build And Test Windows
    needs: changes
    if: ${{ needs.changes.outputs.run_windows == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore tools
        run: dotnet tool restore

      - name: Restore
        run: dotnet restore AFK4.sln

      - name: Build
        run: dotnet build AFK4.sln --no-restore -p:NuGetAudit=false -p:UseSharedCompilation=false -v minimal

      - name: Test
        run: dotnet test AFK4.sln --no-build -p:NuGetAudit=false -p:UseSharedCompilation=false -v minimal

  build-test-web:
    name: Build And Test Web
    needs: changes
    if: ${{ needs.changes.outputs.run_web == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # bun's --filter does not match the src/AFK4.*.Web workspaces, so iterate
      # the workspace dirs explicitly; each runs in its own dir to pick up its bunfig.
      - name: Test web workspaces
        run: |
          set -e
          for dir in \
            packages/formatting packages/i18n packages/money \
            src/AFK4.Platform.Web src/AFK4.Operator.App.Web \
            src/AFK4.Customer.Web src/AFK4.SetupWizard.Web; do
            echo "::group::test $dir"
            # Run each workspace's own `test` script, not a bare `bun test`: the operator app
            # splits App.test into its own bun process to dodge bun's cross-file mock.module leak
            # (see #88). A bare `bun test` here ran every file in one process and reintroduced the
            # flake; `bun run test` honours that isolation. Other workspaces' `test` == `bun test`.
            (cd "$dir" && bun run test)
            echo "::endgroup::"
          done

      - name: Build web apps
        run: |
          set -e
          for dir in \
            src/AFK4.Platform.Web src/AFK4.Operator.App.Web \
            src/AFK4.Customer.Web src/AFK4.SetupWizard.Web; do
            echo "::group::build $dir"
            (cd "$dir" && bun run build)
            echo "::endgroup::"
          done

  pr-verification-result:
    name: PR Verification Result
    needs:
      - changes
      - build-test-windows
      - build-test-web
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check result
        shell: pwsh
        run: |
          $changesResult = "${{ needs.changes.result }}"
          $runWindows = "${{ needs.changes.outputs.run_windows }}"
          $windowsResult = "${{ needs.build-test-windows.result }}"
          $runWeb = "${{ needs.changes.outputs.run_web }}"
          $webResult = "${{ needs.build-test-web.result }}"

          if ($changesResult -ne "success") {
            throw "Change detection failed. Result: $changesResult"
          }

          if ($runWindows -eq "true" -and $windowsResult -ne "success") {
            throw "Windows build/test gate did not pass. Result: $windowsResult"
          }

          if ($runWeb -eq "true" -and $webResult -ne "success") {
            throw "Web build/test gate did not pass. Result: $webResult"
          }

          if ($runWindows -ne "true") {
            Write-Host "No Windows-relevant changes detected; skipping paid Windows runner."
          }
          else {
            Write-Host "Windows build/test gate passed."
          }

          if ($runWeb -ne "true") {
            Write-Host "No web-relevant changes detected; skipping web checks."
          }
          else {
            Write-Host "Web build/test gate passed."
          }
