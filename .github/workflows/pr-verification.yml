name: PR Verification

# Every pull request is verified, not only those targeting main: work that lands on a long-lived
# design branch first would otherwise reach main having never been checked.
on:
  pull_request:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: pr-verification-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Relevant Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_dotnet: ${{ steps.filter.outputs.run_dotnet }}
      run_windows: ${{ steps.filter.outputs.run_windows }}
      run_api: ${{ steps.filter.outputs.run_api }}
      run_aot: ${{ steps.filter.outputs.run_aot }}
      run_web: ${{ steps.filter.outputs.run_web }}
      run_flutter: ${{ steps.filter.outputs.run_flutter }}
      run_site: ${{ steps.filter.outputs.run_site }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect relevant changes
        id: filter
        shell: pwsh
        run: |
          $base = "${{ github.event.pull_request.base.sha }}"
          $head = "${{ github.event.pull_request.head.sha }}"
          $changed = git diff --name-only "$base...$head"
          $relevantPrefixes = @(
            ".github/workflows/",
            "deploy/",
            "installers/",
            "scripts/",
            "src/",
            "tests/"
          )
          # Только выкладывают: правка такого файла не меняет продукт, платная Windows-дорожка и PostgreSQL ей не нужны.
          $deployOnlyFiles = @(
            ".github/workflows/public-site.yml",
            ".github/workflows/demo-pages.yml",
            ".github/workflows/coolify-staging-deploy.yml"
          )
          # Публичный сайт: Go-генератор, токены и логотипы, из которых он собирается. Дорожка лёгкая, на Ubuntu.
          $sitePrefixes = @(
            "site/",
            "packages/tokens/",
            "brand/",
            ".github/workflows/public-site.yml",
            ".github/workflows/pr-verification.yml"
          )
          # Пути, которые видит только одна из двух .NET-дорожек. Остальное (контракты, общие файлы сборки, скрипты, решение) поднимает обе.
          # Платформенный API зависит только от AFK4.Shared.Contracts, Windows-программы от API не зависят.
          $apiOnlyPrefixes = @(
            "src/AFK4.Platform.Api/",
            "tests/AFK4.Platform.Api.Tests/"
          )
          $windowsOnlyPrefixes = @(
            "src/AFK4.Agent.Service/",
            "src/AFK4.SetupWizard/",
            "src/AFK4.SetupWizard.Core/",
            "src/AFK4.WebHost/",
            "src/AFK4.OrganizationAdmin.App/",
            "src/AFK4.Player.Shell/",
            "src/AFK4.Update.Publisher/",
            # Веб-интерфейсы программ на Windows API не вызывают в тестах: их проверяет веб-дорожка.
            "src/AFK4.OrganizationAdmin.Web/",
            "src/AFK4.SetupWizard.Web/",
            "src/AFK4.Player.Shell.Web/",
            "installers/",
            "tests/AFK4.Agent.Service.Tests/",
            "tests/AFK4.SetupWizard.Tests/",
            "tests/AFK4.OrganizationAdmin.App.Tests/",
            "tests/AFK4.Player.Shell.Tests/",
            "tests/AFK4.NetFramework.Tests/",
            "tests/AFK4.Update.Publisher.Tests/"
          )
          # Публикация Native AOT (две разрядности, ~2,5 минуты на платном раннере) нужна, только если тронуты программы на AOT или то, из чего они собираются.
          $aotPrefixes = @(
            "src/AFK4.Agent.Service/",
            "src/AFK4.SetupWizard/",
            "src/AFK4.SetupWizard.Core/",
            "src/AFK4.Player.Shell/",
            "src/AFK4.Localization/",
            "src/AFK4.WebHost/",
            "src/AFK4.Shared.Contracts/",
            "src/Compat/",
            "scripts/fetch-miniblink.ps1",
            ".github/workflows/pr-verification.yml"
          )
          $relevantFiles = @(
            "AFK4.sln",
            ".config/dotnet-tools.json",
            "Directory.Build.props",
            "Directory.Packages.props",
            "global.json",
            "NuGet.config"
          )
          $webPrefixes = @(
            ".github/workflows/pr-verification.yml",
            # Правка логотипов и фавиконок обязана поднимать веб-дорожку: её набор проверяет,
            # что каждое веб-приложение везёт актуальный фавикон, а не плейсхолдер.
            "brand/",
            "packages/",
            # Контракты — исходник типов веба: правка записи C# обязана поднимать эту дорожку.
            "src/AFK4.Shared.Contracts/",
            "src/AFK4.PlatformControl.Web/",
            "src/AFK4.OrganizationAdmin.Web/",
            "src/AFK4.SetupWizard.Web/",
            "src/AFK4.Player.Shell.Web/"
          )
          $flutterPrefixes = @(
            ".github/workflows/pr-verification.yml",
            "locales/",
            "packages/i18n/",
            # Классы DTO мобильного приложения рождаются из записей C# тем же генератором.
            "packages/contracts/",
            "src/AFK4.Shared.Contracts/",
            "src/afk4_customer_app/"
          )
          $webFiles = @(
            "package.json",
            "bun.lock",
            "bunfig.toml"
          )
          $runDotnet = $false
          $runWindows = $false
          $runApi = $false
          $runAot = $false
          $runWeb = $false
          $runFlutter = $false
          $runSite = $false

          foreach ($path in $changed) {
            foreach ($prefix in $sitePrefixes) {
              if ($path.StartsWith($prefix, [System.StringComparison]::OrdinalIgnoreCase)) {
                $runSite = $true
              }
            }
            if ($deployOnlyFiles -contains $path) {
              continue
            }
            $dotnetRelevant = $relevantFiles -contains $path
            foreach ($prefix in $relevantPrefixes) {
              if ($path.StartsWith($prefix, [System.StringComparison]::OrdinalIgnoreCase)) {
                $dotnetRelevant = $true
              }
            }
            if ($dotnetRelevant) {
              $runDotnet = $true
              $isApiOnly = $false
              $isWindowsOnly = $false
              foreach ($prefix in $apiOnlyPrefixes) {
                if ($path.StartsWith($prefix, [System.StringComparison]::OrdinalIgnoreCase)) { $isApiOnly = $true }
              }
              foreach ($prefix in $windowsOnlyPrefixes) {
                if ($path.StartsWith($prefix, [System.StringComparison]::OrdinalIgnoreCase)) { $isWindowsOnly = $true }
              }
              if (-not $isApiOnly) { $runWindows = $true }
              if (-not $isWindowsOnly) { $runApi = $true }
            }
            if ($relevantFiles -contains $path) {
              $runAot = $true
            }
            foreach ($prefix in $aotPrefixes) {
              if ($path.StartsWith($prefix, [System.StringComparison]::OrdinalIgnoreCase)) {
                $runAot = $true
              }
            }

            if ($webFiles -contains $path) {
              $runWeb = $true
            }
            foreach ($prefix in $webPrefixes) {
              if ($path.StartsWith($prefix, [System.StringComparison]::OrdinalIgnoreCase)) {
                $runWeb = $true
              }
            }

            foreach ($prefix in $flutterPrefixes) {
              if ($path.StartsWith($prefix, [System.StringComparison]::OrdinalIgnoreCase)) {
                $runFlutter = $true
              }
            }

            if ($runWindows -and $runApi -and $runAot -and $runWeb -and $runFlutter -and $runSite) {
              break
            }
          }

          Write-Host "Changed paths:"
          $changed | ForEach-Object { Write-Host " - $_" }
          Write-Host "Run .NET build/test: $runDotnet (Windows: $runWindows, API on PostgreSQL: $runApi, Native AOT publish: $runAot)"
          Write-Host "Run web build/test: $runWeb"
          Write-Host "Run Flutter build/test: $runFlutter"
          Write-Host "Run public site build: $runSite"
          "run_dotnet=$($runDotnet.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "run_windows=$($runWindows.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "run_api=$($runApi.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "run_aot=$($runAot.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "run_web=$($runWeb.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "run_flutter=$($runFlutter.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "run_site=$($runSite.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

  build-test-windows:
    name: Build And Test Windows
    needs: changes
    if: ${{ needs.changes.outputs.run_windows == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Packages.props', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore tools
        run: dotnet tool restore

      - name: Restore
        run: dotnet restore AFK4.sln

      - name: Build
        run: dotnet build AFK4.sln --no-restore -p:NuGetAudit=false -p:UseSharedCompilation=false -v minimal

      # По одному проекту за раз: `dotnet test` принимает ровно один. Набор API сюда не входит:
      # он идёт на Linux с настоящим PostgreSQL (задача «Test Against PostgreSQL»), где его же
      # ничего не пропускает; здесь он съедал больше половины времени задачи и лишь повторял тот
      # же прогон. Новые тестовые проекты подхватываются сами.
      - name: Test
        shell: pwsh
        run: |
          $projects = Get-ChildItem tests -Recurse -Depth 1 -Filter *.csproj |
            Where-Object { $_.BaseName -ne 'AFK4.Platform.Api.Tests' } |
            ForEach-Object { Resolve-Path -Relative $_.FullName }
          foreach ($project in $projects) {
            Write-Host "::group::test $project"
            dotnet test --project $project --no-build -p:NuGetAudit=false -p:UseSharedCompilation=false -v minimal
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Write-Host "::endgroup::"
          }

      # Программы на Native AOT (docs/roadmap/windows7.md). Компилятор AOT есть только на Windows, и его
      # предупреждения сборка видит лишь при публикации: обе разрядности, предупреждение — провал. Мастер везёт
      # рядом DLL Miniblink своей разрядности.
      - name: Publish Native AOT programs
        if: ${{ needs.changes.outputs.run_aot == 'true' }}
        shell: pwsh
        run: |
          ./scripts/fetch-miniblink.ps1
          $programs = @{ 'agent' = @('src/AFK4.Agent.Service', 'net10.0'); 'setup-wizard' = @('src/AFK4.SetupWizard', 'net10.0-windows'); 'player-shell' = @('src/AFK4.Player.Shell', 'net10.0-windows') }
          foreach ($runtime in 'win-x64', 'win-x86') {
            foreach ($program in $programs.GetEnumerator()) {
              Write-Host "::group::publish $($program.Key) $runtime"
              dotnet publish $program.Value[0] -f $program.Value[1] -r $runtime -c Release -o "artifacts/aot/$runtime/$($program.Key)" -p:DebugType=none -p:NuGetAudit=false -p:UseSharedCompilation=false -v minimal
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              Get-ChildItem "artifacts/aot/$runtime/$($program.Key)" -File | ForEach-Object { "{0} {1:N1} MB" -f $_.Name, ($_.Length / 1MB) }
              Write-Host "::endgroup::"
            }
          }

      # Программы для приёмки на стенде — отдельным маленьким архивом, а не в общем архиве пакетов на сотни МБ.
      # Только exe: DLL Miniblink та же, что качает scripts/fetch-miniblink.ps1 (сверена по SHA-256), её не возим.
      - name: Upload Native AOT programs
        if: ${{ needs.changes.outputs.run_aot == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: aot-programs
          path: artifacts/aot/*/*/*.exe
          retention-days: 3

  # The Windows job above cannot host this: GitHub service containers are Linux-only, so the
  # Postgres-backed tests would skip themselves there — which is exactly what used to happen.
  # Linux is also where the API actually runs in production.
  test-postgres:
    name: Test Against PostgreSQL (${{ matrix.shard }}/3)
    needs: changes
    if: ${{ needs.changes.outputs.run_api == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Набор API — три четверти всего времени тестов, а раннер на две ядра: три части идут втрое
    # быстрее одной, и каждая со своей базой. Деление и сверка числа тестов — scripts/test-shard.sh.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    services:
      postgres:
        # Throwaway credentials for a container reachable only from this runner; the production
        # database is configured elsewhere and shares nothing with it.
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: afk4_ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # Every suite isolates itself in its own generated schema, so one database serves them all.
      # The name must end in _test: each attribute refuses to touch a database that is not marked
      # disposable.
      AFK4_POS_POSTGRES_TEST_CONNECTION_STRING: Host=127.0.0.1;Port=5432;Database=afk4_ci_test;Username=postgres;Password=postgres
      AFK4_RESERVATION_POSTGRES_TEST_CONNECTION_STRING: Host=127.0.0.1;Port=5432;Database=afk4_ci_test;Username=postgres;Password=postgres
      AFK4_COMMERCE_TEST_POSTGRES: Host=127.0.0.1;Port=5432;Database=afk4_ci_test;Username=postgres;Password=postgres
      AFK4_PLATFORM_ADMIN_POSTGRES_TEST_CONNECTION_STRING: Host=127.0.0.1;Port=5432;Database=afk4_ci_test;Username=postgres;Password=postgres
      # Turns a broken database configuration into a red build instead of a green one full of
      # skipped tests. See PostgresTestAvailabilityTests.
      AFK4_REQUIRE_POSTGRES_TESTS: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Packages.props', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      # Only the API test project: the solution also carries WPF projects, which do not build off Windows.
      - name: Build
        run: dotnet build tests/AFK4.Platform.Api.Tests -p:NuGetAudit=false -v minimal

      # Правка одного только API не поднимает Windows-дорожку, а DevSeed собирается вместе с API: проверяем, что он не сломан.
      - name: Build the API seed tool
        if: ${{ matrix.shard == 1 }}
        run: dotnet build src/AFK4.Platform.DevSeed -p:NuGetAudit=false -v minimal

      - name: Test
        run: scripts/test-shard.sh tests/AFK4.Platform.Api.Tests ${{ matrix.shard }} 3 -p:NuGetAudit=false -v minimal

  build-test-web:
    name: Build And Test Web
    needs: changes
    if: ${{ needs.changes.outputs.run_web == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Типы веба рождаются из записей C# тем же способом, что ARB из каталога строк.
      # Перегенерируем и требуем чистого дерева: правка контракта без перегенерации иначе
      # доедет до приложений как молча устаревший тип — ровно тот дрейф, ради которого
      # генератор и заведён.
      - name: Verify generated contracts are current
        run: |
          set -e
          (cd packages/contracts && bun run gen)
          git diff --exit-code -- packages/contracts/src src/afk4_customer_app/lib/api/contracts.dart

      # bun's --filter does not match the src/AFK4.*.Web workspaces, so iterate
      # the workspace dirs explicitly; each runs in its own dir to pick up its bunfig.
      # The list must hold every workspace with a `test` script — a workspace missing here is
      # not "not covered yet", it is a suite that goes red without anyone finding out.
      # Линтер ловит то, что не ловят ни тесты, ни сборка: мёртвые импорты и переменные,
      # перекрытые глобальные имена, `==` вместо `===`. Набор правил намеренно узкий — см.
      # biome.json: правило, которое кричит на здоровый код, скоро начинают игнорировать.
      - name: Lint web workspaces
        run: bun run lint

      - name: Test web workspaces
        run: |
          set -e
          for dir in \
            packages/contracts packages/formatting packages/host-bridge packages/i18n packages/money \
            packages/tokens packages/ui \
            src/AFK4.PlatformControl.Web src/AFK4.OrganizationAdmin.Web \
            src/AFK4.SetupWizard.Web \
            src/AFK4.Player.Shell.Web; do
            echo "::group::test $dir"
            # Run each workspace's own `test` script, not a bare `bun test`: Organization Admin
            # splits App.test into its own bun process to dodge bun's cross-file mock.module leak
            # (see #88). A bare `bun test` here ran every file in one process and reintroduced the
            # flake; `bun run test` honours that isolation. Other workspaces' `test` == `bun test`.
            (cd "$dir" && bun run test)
            echo "::endgroup::"
          done

      # У brand нет своей рабочей области (нет package.json), поэтому он не попадал в цикл выше
      # и его набор краснел, никем не замеченный: он ссылался на favicon удалённого веб-игрока.
      - name: Test brand assets
        run: bun test brand/afk4-brand.test.ts

      - name: Build web apps
        run: |
          set -e
          for dir in \
            src/AFK4.PlatformControl.Web src/AFK4.OrganizationAdmin.Web \
            src/AFK4.SetupWizard.Web \
            src/AFK4.Player.Shell.Web; do
            echo "::group::build $dir"
            (cd "$dir" && bun run build)
            echo "::endgroup::"
          done

  build-test-flutter:
    name: Build And Test Flutter
    needs: changes
    if: ${{ needs.changes.outputs.run_flutter == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.8
          channel: stable
          cache: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # ARB рождаются из locales/*.json тем же генератором, что и messages.ts. Перегенерируем
      # и требуем чистого дерева: правка каталога без перегенерации иначе доедет до магазина
      # как молча устаревший перевод.
      - name: Verify generated localization is current
        run: |
          set -e
          (cd packages/i18n && bun run gen)
          git diff --exit-code -- locales src/afk4_customer_app/lib/l10n packages/i18n/src

      # `flutter pub get` сам генерирует классы локализации из .arb (generate: true),
      # поэтому отдельного шага gen-l10n не нужно.
      - name: Analyze and test
        run: |
          set -e
          cd src/afk4_customer_app
          flutter pub get
          flutter analyze
          flutter test

      # Сквозной сценарий поднимает приложение целиком и подменяет только сервер. Идёт на
      # flutter-tester: без `-d` инструмент ищет подключённое устройство, которого на раннере
      # нет, и `integration_test/` в обычный `flutter test` не попадает.
      - name: End-to-end journey
        run: |
          set -e
          cd src/afk4_customer_app
          flutter test integration_test -d flutter-tester

      - name: Build web
        run: |
          set -e
          cd src/afk4_customer_app
          flutter build web --release

  build-site:
    name: Build Public Site
    needs: changes
    if: ${{ needs.changes.outputs.run_site == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: site/go.mod

      - name: Vet, format and build
        working-directory: site
        run: |
          go vet ./...
          test -z "$(gofmt -l .)" || { gofmt -l .; echo "gofmt: файлы выше не отформатированы"; exit 1; }
          go run .

      - name: Check the built pages
        run: |
          for page in index download code-signing privacy; do
            for dir in "" tg/ en/; do
              test -s "site/dist/${dir}${page}.html" || { echo "нет страницы ${dir}${page}.html"; exit 1; }
            done
          done
          for file in tokens.css styles.css app.js lite.js _headers; do
            test -s "site/dist/${file}" || { echo "нет файла ${file}"; exit 1; }
          done
          if grep -rl '{{' site/dist --include='*.html'; then echo "в страницах остались необработанные шаблоны"; exit 1; fi

  pr-verification-result:
    name: PR Verification Result
    needs:
      - changes
      - build-test-windows
      - test-postgres
      - build-test-web
      - build-test-flutter
      - build-site
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check result
        shell: pwsh
        run: |
          $changesResult = "${{ needs.changes.result }}"
          $runWindows = "${{ needs.changes.outputs.run_windows }}"
          $runApi = "${{ needs.changes.outputs.run_api }}"
          $windowsResult = "${{ needs.build-test-windows.result }}"
          $postgresResult = "${{ needs.test-postgres.result }}"
          $runWeb = "${{ needs.changes.outputs.run_web }}"
          $webResult = "${{ needs.build-test-web.result }}"
          $runFlutter = "${{ needs.changes.outputs.run_flutter }}"
          $flutterResult = "${{ needs.build-test-flutter.result }}"
          $runSite = "${{ needs.changes.outputs.run_site }}"
          $siteResult = "${{ needs.build-site.result }}"

          if ($changesResult -ne "success") {
            throw "Change detection failed. Result: $changesResult"
          }

          if ($runWindows -eq "true" -and $windowsResult -ne "success") {
            throw "Windows build/test gate did not pass. Result: $windowsResult"
          }

          if ($runApi -eq "true" -and $postgresResult -ne "success") {
            throw "PostgreSQL test gate did not pass. Result: $postgresResult"
          }

          if ($runWeb -eq "true" -and $webResult -ne "success") {
            throw "Web build/test gate did not pass. Result: $webResult"
          }

          if ($runFlutter -eq "true" -and $flutterResult -ne "success") {
            throw "Flutter build/test gate did not pass. Result: $flutterResult"
          }

          if ($runSite -eq "true" -and $siteResult -ne "success") {
            throw "Public site build gate did not pass. Result: $siteResult"
          }

          if ($runWindows -ne "true") {
            Write-Host "No Windows-relevant changes detected; skipping the paid Windows runner."
          }
          else {
            Write-Host "Windows build/test gate passed."
          }

          if ($runApi -ne "true") {
            Write-Host "No API-relevant changes detected; skipping the PostgreSQL job."
          }
          else {
            Write-Host "PostgreSQL gate passed."
          }

          if ($runWeb -ne "true") {
            Write-Host "No web-relevant changes detected; skipping web checks."
          }
          else {
            Write-Host "Web build/test gate passed."
          }

          if ($runFlutter -ne "true") {
            Write-Host "No Flutter-relevant changes detected; skipping Flutter checks."
          }
          else {
            Write-Host "Flutter build/test gate passed."
          }
