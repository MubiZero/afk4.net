name: Package Smoke

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/package-smoke.yml"
      - ".config/dotnet-tools.json"
      - "installers/**"
      - "scripts/build-client-packages.ps1"
      - "scripts/install-afk4-update-msi.ps1"
      - "scripts/publish-client-msi-updates.ps1"
      - "scripts/register-update-package-requests.ps1"
      - "scripts/rollback-afk4-update-msi.ps1"
      - "scripts/restart-afk4-agent-service.ps1"
      - "src/AFK4.Shared.Contracts/**"
      - "src/AFK4.OrganizationAdmin.App/**"
      - "src/AFK4.OrganizationAdmin.Web/**"
      - "src/AFK4.Agent.Service/**"
      - "src/AFK4.Player.Shell/**"
      - "src/AFK4.SetupWizard/**"
      - "src/AFK4.SetupWizard.Core/**"
      - "Directory.Build.props"
      - "Directory.Packages.props"
      - "NuGet.config"
      - "global.json"
      - "AFK4.sln"
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: package-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-smoke:
    name: Build Unsigned MSI Packages
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Restore tools
        run: dotnet tool restore

      - name: Compute package version
        shell: pwsh
        run: |
          $version = "0.1.$env:GITHUB_RUN_NUMBER"
          "AFK4_PACKAGE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build client packages
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File scripts/build-client-packages.ps1 `
            -Version $env:AFK4_PACKAGE_VERSION `
            -Channel internal

      - name: Verify package artifacts
        shell: pwsh
        run: |
          # The deliverable is now the single master installer (Burn bundle); the per-app MSIs
          # are bundle inputs and live under intermediates\ (see scripts/build-client-packages.ps1).
          $expectedArtifacts = @(
            "artifacts/client-packages/afk4-client-$env:AFK4_PACKAGE_VERSION-internal.exe",
            "artifacts/client-packages/intermediates/afk4-organization-admin-$env:AFK4_PACKAGE_VERSION-internal.msi",
            "artifacts/client-packages/intermediates/afk4-agent-$env:AFK4_PACKAGE_VERSION-internal.msi",
            "artifacts/client-packages/intermediates/afk4-player-shell-$env:AFK4_PACKAGE_VERSION-internal.msi"
          )

          foreach ($artifact in $expectedArtifacts) {
            if (-not (Test-Path -LiteralPath $artifact)) {
              throw "Expected package artifact was not produced: $artifact"
            }
          }

      - name: Publish staging update metadata to MinIO
        shell: pwsh
        env:
          AFK4_UPDATE_SIGNING_KEY_PEM: ${{ secrets.AFK4_UPDATE_SIGNING_KEY_PEM }}
          AFK4_STAGING_MINIO_ACCESS_KEY: ${{ secrets.AFK4_STAGING_MINIO_ACCESS_KEY }}
          AFK4_STAGING_MINIO_SECRET_KEY: ${{ secrets.AFK4_STAGING_MINIO_SECRET_KEY }}
          AFK4_STAGING_ORGANIZATION_ID: ${{ vars.AFK4_STAGING_ORGANIZATION_ID }}
          AFK4_STAGING_MINIO_ENDPOINT: ${{ vars.AFK4_STAGING_MINIO_ENDPOINT }}
          AFK4_STAGING_MINIO_BUCKET: ${{ vars.AFK4_STAGING_MINIO_BUCKET }}
          AFK4_STAGING_UPDATE_PUBLIC_BASE_URI: ${{ vars.AFK4_STAGING_UPDATE_PUBLIC_BASE_URI }}
        run: |
          $required = @(
            'AFK4_UPDATE_SIGNING_KEY_PEM',
            'AFK4_STAGING_MINIO_ACCESS_KEY',
            'AFK4_STAGING_MINIO_SECRET_KEY',
            'AFK4_STAGING_ORGANIZATION_ID',
            'AFK4_STAGING_MINIO_ENDPOINT',
            'AFK4_STAGING_MINIO_BUCKET',
            'AFK4_STAGING_UPDATE_PUBLIC_BASE_URI'
          )

          foreach ($name in $required) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "$name is required for staging update publishing."
            }
          }

          powershell -ExecutionPolicy Bypass -File scripts/publish-client-msi-updates.ps1 `
            -Version $env:AFK4_PACKAGE_VERSION `
            -Channel internal `
            -OrganizationId $env:AFK4_STAGING_ORGANIZATION_ID `
            -PackageDirectory artifacts/client-packages `
            -OutputDirectory artifacts/update-packages `
            -ArtifactStore s3 `
            -S3Endpoint $env:AFK4_STAGING_MINIO_ENDPOINT `
            -S3Bucket $env:AFK4_STAGING_MINIO_BUCKET `
            -S3AccessKeyEnvVar AFK4_STAGING_MINIO_ACCESS_KEY `
            -S3SecretKeyEnvVar AFK4_STAGING_MINIO_SECRET_KEY `
            -PublicBaseUri $env:AFK4_STAGING_UPDATE_PUBLIC_BASE_URI `
            -OrganizationAdminStableAliasObjectKey organization-admin/internal/latest/afk4-organization-admin-internal.msi `
            -SigningKeyEnvVar AFK4_UPDATE_SIGNING_KEY_PEM `
            -ReleaseNotes "Package smoke build $env:AFK4_PACKAGE_VERSION."

      # Регистрация пакета на платформе из смоука убрана намеренно. Релиз заводится
      # администратором платформы, а вход администратора обязан пройти двухфакторку —
      # неинтерактивного токена для этого нет и заводить его в обход 2FA мы не будем.
      # Смоук доказывает то, что может доказать сам: MSI собираются, метаданные и артефакты
      # уезжают в хранилище, стабильный установщик совпадает с ними побайтно и API отдаёт
      # на него ссылку. Пакет регистрируется руками в панели платформы, там же и раскатка.
      - name: Report update package requests awaiting registration
        shell: pwsh
        run: |
          $requestPaths = @(
            "artifacts/update-packages/organization-admin-$env:AFK4_PACKAGE_VERSION-internal-request.json",
            "artifacts/update-packages/agent-service-$env:AFK4_PACKAGE_VERSION-internal-request.json",
            "artifacts/update-packages/player-shell-$env:AFK4_PACKAGE_VERSION-internal-request.json"
          )

          foreach ($requestPath in $requestPaths) {
            if (-not (Test-Path -LiteralPath $requestPath -PathType Leaf)) {
              throw "Expected update package request was not produced: $requestPath"
            }

            $request = Get-Content -LiteralPath $requestPath -Raw | ConvertFrom-Json
            foreach ($field in @('component', 'version', 'channel', 'artifactUri', 'sha256', 'signature', 'signatureAlgorithm', 'sizeBytes')) {
              if ($null -eq $request.$field -or [string]::IsNullOrWhiteSpace([string]$request.$field)) {
                throw "Update package request '$requestPath' is missing required field '$field'."
              }
            }

            Write-Host "Ready to register: $($request.component) $($request.version) ($($request.channel))"
          }

          Write-Host "Register these packages in Platform Control, or run scripts/register-update-package-requests.ps1 with a platform administrator token."

      - name: Verify stable Organization Admin installer
        shell: pwsh
        env:
          AFK4_STAGING_ORGANIZATION_ID: ${{ vars.AFK4_STAGING_ORGANIZATION_ID }}
          AFK4_STAGING_BRANCH_ID: ${{ vars.AFK4_STAGING_BRANCH_ID }}
          AFK4_STAGING_PLATFORM_BASE_URL: ${{ vars.AFK4_STAGING_PLATFORM_BASE_URL }}
          AFK4_STAGING_UPDATE_PUBLIC_BASE_URI: ${{ vars.AFK4_STAGING_UPDATE_PUBLIC_BASE_URI }}
        run: |
          $requestPath = "artifacts/update-packages/organization-admin-$env:AFK4_PACKAGE_VERSION-internal-request.json"
          if (-not (Test-Path -LiteralPath $requestPath -PathType Leaf)) {
            throw "Organization Admin update request was not produced: $requestPath"
          }

          $request = Get-Content -LiteralPath $requestPath -Raw | ConvertFrom-Json
          if ($request.component -ne 'organization-admin' -or $request.channel -ne 'internal') {
            throw 'Organization Admin update request has an unexpected component or channel.'
          }

          $publicBaseUri = [uri]($env:AFK4_STAGING_UPDATE_PUBLIC_BASE_URI.Trim().TrimEnd('/') + '/')
          $immutableUri = [uri]$request.artifactUri
          if ($publicBaseUri.Scheme -ne 'https' -or $immutableUri.Scheme -ne 'https' -or $immutableUri.Host -ne $publicBaseUri.Host -or -not $immutableUri.AbsoluteUri.StartsWith($publicBaseUri.AbsoluteUri, [System.StringComparison]::Ordinal)) {
            throw 'Organization Admin artifact URI is outside AFK4_STAGING_UPDATE_PUBLIC_BASE_URI.'
          }

          $stableRelativePath = 'organization-admin/internal/latest/afk4-organization-admin-internal.msi'
          $stableUri = [uri]::new($publicBaseUri, $stableRelativePath)
          $downloadPath = Join-Path $env:RUNNER_TEMP 'afk4-organization-admin-internal.msi'
          Invoke-WebRequest -Uri $stableUri -OutFile $downloadPath -TimeoutSec 120
          $actualSize = (Get-Item -LiteralPath $downloadPath).Length
          $actualSha256 = (Get-FileHash -LiteralPath $downloadPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualSize -ne [long]$request.sizeBytes -or $actualSha256 -ne [string]$request.sha256) {
            throw "Stable Organization Admin installer does not match immutable request metadata."
          }

          $platformBaseUrl = $env:AFK4_STAGING_PLATFORM_BASE_URL.TrimEnd('/')
          $compatibilityUri = "$platformBaseUrl/api/organizations/$env:AFK4_STAGING_ORGANIZATION_ID/branches/$env:AFK4_STAGING_BRANCH_ID/floor-map"
          $compatibilityResponse = Invoke-WebRequest -Uri $compatibilityUri -SkipHttpErrorCheck -TimeoutSec 60
          $compatibilityBody = $compatibilityResponse.Content | ConvertFrom-Json
          if ($compatibilityResponse.StatusCode -ne 426 -or $compatibilityBody.code -ne 'organization_admin_upgrade_required' -or [string]$compatibilityBody.downloadUrl -ne $stableUri.AbsoluteUri) {
            throw 'Organization Admin compatibility response does not expose the verified stable installer URL.'
          }

          Write-Host "Stable Organization Admin installer verified: $($stableUri.AbsoluteUri)"

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: afk4-package-smoke-0.1.${{ github.run_number }}-internal
          path: |
            artifacts/client-packages/afk4-client-*-internal.exe
            artifacts/client-packages/intermediates/*.msi
          if-no-files-found: error
          retention-days: 3

      - name: Upload update package requests
        uses: actions/upload-artifact@v4
        with:
          name: afk4-package-smoke-update-requests-0.1.${{ github.run_number }}-internal
          path: artifacts/update-packages/*-request.json
          if-no-files-found: error
          retention-days: 3
