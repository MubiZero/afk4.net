name: Client Packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: Package version
        required: true
        type: string
      channel:
        description: Update channel
        required: true
        default: internal
        type: choice
        options:
          - internal
          - beta
          - stable
      sign_packages:
        description: Authenticode-sign generated MSI artifacts
        required: true
        default: false
        type: boolean
      signing_provider:
        description: Signing provider used when sign_packages=true
        required: true
        default: authenticode-pfx
        type: choice
        options:
          - authenticode-pfx
          - signpath
      publish_update_metadata:
        description: Publish signed update metadata for generated MSI artifacts
        required: true
        default: false
        type: boolean
      register_update_packages:
        description: Register generated update package request JSON with Platform API
        required: true
        default: false
        type: boolean
      create_update_rollouts:
        description: Create update rollouts after backend package registration
        required: true
        default: false
        type: boolean
      organization_id:
        description: Organization id for update package metadata
        required: false
        type: string
      branch_id:
        description: Branch id for backend update package registration
        required: false
        type: string
      platform_base_url:
        description: Platform API base URL used only when register_update_packages is true
        required: false
        type: string
      artifact_store:
        description: Update artifact store mode
        required: true
        default: file-system
        type: choice
        options:
          - file-system
          - http-put
          - s3
      hosting_root:
        description: File-system hosting root used when artifact_store is file-system
        required: false
        type: string
      public_base_uri:
        description: Public base URI used when artifact_store is file-system or s3
        required: false
        type: string
      s3_endpoint:
        description: S3/MinIO endpoint used when artifact_store is s3
        required: false
        type: string
      s3_bucket:
        description: S3/MinIO bucket used when artifact_store is s3
        required: false
        type: string
      s3_key_prefix:
        description: Optional S3/MinIO key prefix used when artifact_store is s3
        required: false
        type: string
      operator_artifact_upload_uri:
        description: Presigned upload URI for the Operator App MSI
        required: false
        type: string
      operator_artifact_public_uri:
        description: Public download URI for the Operator App MSI
        required: false
        type: string
      gaming_pc_artifact_upload_uri:
        description: Presigned upload URI for the coordinated gaming-PC MSI
        required: false
        type: string
      gaming_pc_artifact_public_uri:
        description: Public download URI for the coordinated gaming-PC MSI
        required: false
        type: string
      release_notes:
        description: Release notes embedded in signed update package metadata
        required: false
        type: string
      rollout_component:
        description: Component to roll out after registration
        required: false
        default: agent-service
        type: choice
        options:
          - agent-service
          - player-shell
          - operator-app
      rollout_target_kind:
        description: Rollout target kind
        required: false
        default: device
        type: choice
        options:
          - device
          - branch
      rollout_target_device_id:
        description: Device id used when rollout_target_kind is device
        required: false
        type: string
      rollout_reason:
        description: Reason recorded on created rollouts
        required: false
        type: string

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-client-packages:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Guard release mode
        shell: pwsh
        env:
          INPUT_CHANNEL: ${{ inputs.channel }}
          INPUT_SIGN_PACKAGES: ${{ inputs.sign_packages }}
          INPUT_SIGNING_PROVIDER: ${{ inputs.signing_provider }}
          INPUT_PUBLISH_UPDATE_METADATA: ${{ inputs.publish_update_metadata }}
          INPUT_REGISTER_UPDATE_PACKAGES: ${{ inputs.register_update_packages }}
          INPUT_CREATE_UPDATE_ROLLOUTS: ${{ inputs.create_update_rollouts }}
          INPUT_ORGANIZATION_ID: ${{ inputs.organization_id }}
          INPUT_BRANCH_ID: ${{ inputs.branch_id }}
          INPUT_PLATFORM_BASE_URL: ${{ inputs.platform_base_url }}
          INPUT_ARTIFACT_STORE: ${{ inputs.artifact_store }}
          INPUT_HOSTING_ROOT: ${{ inputs.hosting_root }}
          INPUT_PUBLIC_BASE_URI: ${{ inputs.public_base_uri }}
          INPUT_S3_ENDPOINT: ${{ inputs.s3_endpoint }}
          INPUT_S3_BUCKET: ${{ inputs.s3_bucket }}
          INPUT_OPERATOR_ARTIFACT_UPLOAD_URI: ${{ inputs.operator_artifact_upload_uri }}
          INPUT_OPERATOR_ARTIFACT_PUBLIC_URI: ${{ inputs.operator_artifact_public_uri }}
          INPUT_GAMING_PC_ARTIFACT_UPLOAD_URI: ${{ inputs.gaming_pc_artifact_upload_uri }}
          INPUT_GAMING_PC_ARTIFACT_PUBLIC_URI: ${{ inputs.gaming_pc_artifact_public_uri }}
          INPUT_RELEASE_NOTES: ${{ inputs.release_notes }}
          INPUT_ROLLOUT_TARGET_KIND: ${{ inputs.rollout_target_kind }}
          INPUT_ROLLOUT_TARGET_DEVICE_ID: ${{ inputs.rollout_target_device_id }}
          ALLOWED_PLATFORM_BASE_URLS: ${{ vars.AFK4_ALLOWED_PLATFORM_BASE_URLS }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.AFK4_SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ vars.AFK4_SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.AFK4_SIGNPATH_SIGNING_POLICY_SLUG }}
          SIGNPATH_API_TOKEN: ${{ secrets.AFK4_SIGNPATH_API_TOKEN }}
        run: |
          if ($env:INPUT_CHANNEL -eq 'stable' -and ($env:INPUT_SIGN_PACKAGES -ne 'true' -or $env:INPUT_PUBLISH_UPDATE_METADATA -ne 'true')) {
            throw "Stable releases require signing and update metadata publishing."
          }

          if ($env:INPUT_SIGN_PACKAGES -eq 'true' -and $env:INPUT_SIGNING_PROVIDER -eq 'signpath') {
            $missing = @()
            if ([string]::IsNullOrWhiteSpace($env:SIGNPATH_ORGANIZATION_ID)) { $missing += 'AFK4_SIGNPATH_ORGANIZATION_ID (vars)' }
            if ([string]::IsNullOrWhiteSpace($env:SIGNPATH_PROJECT_SLUG)) { $missing += 'AFK4_SIGNPATH_PROJECT_SLUG (vars)' }
            if ([string]::IsNullOrWhiteSpace($env:SIGNPATH_SIGNING_POLICY_SLUG)) { $missing += 'AFK4_SIGNPATH_SIGNING_POLICY_SLUG (vars)' }
            if ([string]::IsNullOrWhiteSpace($env:SIGNPATH_API_TOKEN)) { $missing += 'AFK4_SIGNPATH_API_TOKEN (secrets)' }
            if ($missing.Count -gt 0) {
              throw "SignPath signing requires the following repository settings: $($missing -join ', ')."
            }
          }

          if ($env:INPUT_REGISTER_UPDATE_PACKAGES -eq 'true' -and $env:INPUT_PUBLISH_UPDATE_METADATA -ne 'true') {
            throw "Backend registration requires publish_update_metadata=true."
          }

          if ($env:INPUT_PUBLISH_UPDATE_METADATA -eq 'true' -and [string]::IsNullOrWhiteSpace($env:INPUT_ORGANIZATION_ID)) {
            throw "organization_id is required when publish_update_metadata=true."
          }

          if ($env:INPUT_PUBLISH_UPDATE_METADATA -eq 'true' -and [string]::IsNullOrWhiteSpace($env:INPUT_RELEASE_NOTES)) {
            throw "release_notes is required when publish_update_metadata=true."
          }

          if ($env:INPUT_PUBLISH_UPDATE_METADATA -eq 'true' -and $env:INPUT_ARTIFACT_STORE -eq 'file-system' -and ([string]::IsNullOrWhiteSpace($env:INPUT_HOSTING_ROOT) -or [string]::IsNullOrWhiteSpace($env:INPUT_PUBLIC_BASE_URI))) {
            throw "hosting_root and public_base_uri are required when artifact_store=file-system."
          }

          if ($env:INPUT_PUBLISH_UPDATE_METADATA -eq 'true' -and $env:INPUT_ARTIFACT_STORE -eq 'http-put' -and ([string]::IsNullOrWhiteSpace($env:INPUT_OPERATOR_ARTIFACT_UPLOAD_URI) -or [string]::IsNullOrWhiteSpace($env:INPUT_OPERATOR_ARTIFACT_PUBLIC_URI) -or [string]::IsNullOrWhiteSpace($env:INPUT_GAMING_PC_ARTIFACT_UPLOAD_URI) -or [string]::IsNullOrWhiteSpace($env:INPUT_GAMING_PC_ARTIFACT_PUBLIC_URI))) {
            throw "operator and gaming-PC upload/public URIs are required when artifact_store=http-put."
          }

          if ($env:INPUT_PUBLISH_UPDATE_METADATA -eq 'true' -and $env:INPUT_ARTIFACT_STORE -eq 's3' -and ([string]::IsNullOrWhiteSpace($env:INPUT_S3_ENDPOINT) -or [string]::IsNullOrWhiteSpace($env:INPUT_S3_BUCKET) -or [string]::IsNullOrWhiteSpace($env:INPUT_PUBLIC_BASE_URI))) {
            throw "s3_endpoint, s3_bucket, and public_base_uri are required when artifact_store=s3."
          }

          if ($env:INPUT_REGISTER_UPDATE_PACKAGES -eq 'true' -and ([string]::IsNullOrWhiteSpace($env:INPUT_PLATFORM_BASE_URL) -or [string]::IsNullOrWhiteSpace($env:INPUT_BRANCH_ID))) {
            throw "platform_base_url and branch_id are required when register_update_packages=true."
          }

          if ($env:INPUT_CREATE_UPDATE_ROLLOUTS -eq 'true' -and $env:INPUT_REGISTER_UPDATE_PACKAGES -ne 'true') {
            throw "create_update_rollouts requires register_update_packages=true."
          }

          if ($env:INPUT_CREATE_UPDATE_ROLLOUTS -eq 'true' -and $env:INPUT_ROLLOUT_TARGET_KIND -eq 'device' -and [string]::IsNullOrWhiteSpace($env:INPUT_ROLLOUT_TARGET_DEVICE_ID)) {
            throw "rollout_target_device_id is required when create_update_rollouts=true and rollout_target_kind=device."
          }

          if ($env:INPUT_REGISTER_UPDATE_PACKAGES -eq 'true' -and [string]::IsNullOrWhiteSpace($env:ALLOWED_PLATFORM_BASE_URLS)) {
            throw "AFK4_ALLOWED_PLATFORM_BASE_URLS is required when register_update_packages=true."
          }

          if ($env:INPUT_REGISTER_UPDATE_PACKAGES -eq 'true') {
            $requestedPlatformBaseUrl = $env:INPUT_PLATFORM_BASE_URL.Trim().TrimEnd('/')
            $allowedPlatformBaseUrls = @(
              $env:ALLOWED_PLATFORM_BASE_URLS -split '[,;\r\n]+' |
                ForEach-Object { $_.Trim().TrimEnd('/') } |
                Where-Object { -not [string]::IsNullOrWhiteSpace($_) }
            )

            if ($allowedPlatformBaseUrls -notcontains $requestedPlatformBaseUrl) {
              throw "platform_base_url is not in AFK4_ALLOWED_PLATFORM_BASE_URLS."
            }
          }

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/AFK4.Operator.App.Web/package-lock.json

      - name: Restore tools
        run: dotnet tool restore

      - name: Restore
        run: dotnet restore AFK4.sln

      - name: Build
        run: dotnet build AFK4.sln --no-restore -p:NuGetAudit=false -p:UseSharedCompilation=false

      - name: Test
        run: dotnet test AFK4.sln --no-build -p:NuGetAudit=false -p:UseSharedCompilation=false -v minimal

      - name: Build client packages
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_CHANNEL: ${{ inputs.channel }}
        run: |
          powershell -ExecutionPolicy Bypass -File scripts/build-client-packages.ps1 -Version $env:INPUT_VERSION -Channel $env:INPUT_CHANNEL

      - name: Prepare Authenticode certificate
        if: ${{ inputs.sign_packages && inputs.signing_provider == 'authenticode-pfx' }}
        shell: pwsh
        env:
          AFK4_AUTHENTICODE_PFX_BASE64: ${{ secrets.AFK4_AUTHENTICODE_PFX_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:AFK4_AUTHENTICODE_PFX_BASE64)) {
            throw "AFK4_AUTHENTICODE_PFX_BASE64 secret is required when sign_packages=true and signing_provider=authenticode-pfx."
          }

          $certificatePath = Join-Path $env:RUNNER_TEMP 'afk4-authenticode-signing.pfx'
          [System.IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:AFK4_AUTHENTICODE_PFX_BASE64))
          "AFK4_AUTHENTICODE_CERTIFICATE_PATH=$certificatePath" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Sign client packages (Authenticode PFX)
        if: ${{ inputs.sign_packages && inputs.signing_provider == 'authenticode-pfx' }}
        shell: pwsh
        env:
          AFK4_AUTHENTICODE_PFX_PASSWORD: ${{ secrets.AFK4_AUTHENTICODE_PFX_PASSWORD }}
        run: |
          powershell -ExecutionPolicy Bypass -File scripts/sign-client-packages.ps1 `
            -PackageDirectory artifacts/client-packages `
            -CertificatePath "$env:AFK4_AUTHENTICODE_CERTIFICATE_PATH" `
            -CertificatePasswordEnvVar AFK4_AUTHENTICODE_PFX_PASSWORD

          $signExitCode = $LASTEXITCODE
          if (-not [string]::IsNullOrWhiteSpace($env:AFK4_AUTHENTICODE_CERTIFICATE_PATH)) {
            Remove-Item -LiteralPath $env:AFK4_AUTHENTICODE_CERTIFICATE_PATH -Force -ErrorAction SilentlyContinue
          }

          if ($signExitCode -ne 0) {
            exit $signExitCode
          }

      - name: Sign client packages (SignPath)
        if: ${{ inputs.sign_packages && inputs.signing_provider == 'signpath' }}
        shell: pwsh
        env:
          AFK4_SIGNPATH_API_TOKEN: ${{ secrets.AFK4_SIGNPATH_API_TOKEN }}
          AFK4_SIGNPATH_ORGANIZATION_ID: ${{ vars.AFK4_SIGNPATH_ORGANIZATION_ID }}
          AFK4_SIGNPATH_PROJECT_SLUG: ${{ vars.AFK4_SIGNPATH_PROJECT_SLUG }}
          AFK4_SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.AFK4_SIGNPATH_SIGNING_POLICY_SLUG }}
          AFK4_SIGNPATH_ARTIFACT_CONFIGURATION_SLUG: ${{ vars.AFK4_SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
        run: |
          $arguments = @(
            '-PackageDirectory', 'artifacts/client-packages',
            '-UseSignPath',
            '-SignPathOrganizationId', $env:AFK4_SIGNPATH_ORGANIZATION_ID,
            '-SignPathProjectSlug', $env:AFK4_SIGNPATH_PROJECT_SLUG,
            '-SignPathSigningPolicySlug', $env:AFK4_SIGNPATH_SIGNING_POLICY_SLUG,
            '-SignPathApiTokenEnvVar', 'AFK4_SIGNPATH_API_TOKEN')

          if (-not [string]::IsNullOrWhiteSpace($env:AFK4_SIGNPATH_ARTIFACT_CONFIGURATION_SLUG)) {
            $arguments += @('-SignPathArtifactConfigurationSlug', $env:AFK4_SIGNPATH_ARTIFACT_CONFIGURATION_SLUG)
          }

          powershell -ExecutionPolicy Bypass -File scripts/sign-client-packages.ps1 @arguments

      - name: Publish update metadata
        if: ${{ inputs.publish_update_metadata }}
        shell: pwsh
        env:
          AFK4_UPDATE_SIGNING_KEY_PEM: ${{ secrets.AFK4_UPDATE_SIGNING_KEY_PEM }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_CHANNEL: ${{ inputs.channel }}
          INPUT_ORGANIZATION_ID: ${{ inputs.organization_id }}
          INPUT_ARTIFACT_STORE: ${{ inputs.artifact_store }}
          INPUT_HOSTING_ROOT: ${{ inputs.hosting_root }}
          INPUT_PUBLIC_BASE_URI: ${{ inputs.public_base_uri }}
          INPUT_S3_ENDPOINT: ${{ inputs.s3_endpoint }}
          INPUT_S3_BUCKET: ${{ inputs.s3_bucket }}
          INPUT_S3_KEY_PREFIX: ${{ inputs.s3_key_prefix }}
          INPUT_OPERATOR_ARTIFACT_UPLOAD_URI: ${{ inputs.operator_artifact_upload_uri }}
          INPUT_OPERATOR_ARTIFACT_PUBLIC_URI: ${{ inputs.operator_artifact_public_uri }}
          INPUT_GAMING_PC_ARTIFACT_UPLOAD_URI: ${{ inputs.gaming_pc_artifact_upload_uri }}
          INPUT_GAMING_PC_ARTIFACT_PUBLIC_URI: ${{ inputs.gaming_pc_artifact_public_uri }}
          INPUT_RELEASE_NOTES: ${{ inputs.release_notes }}
          AFK4_UPDATE_ARTIFACTS_S3_ACCESS_KEY: ${{ secrets.AFK4_UPDATE_ARTIFACTS_S3_ACCESS_KEY }}
          AFK4_UPDATE_ARTIFACTS_S3_SECRET_KEY: ${{ secrets.AFK4_UPDATE_ARTIFACTS_S3_SECRET_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:AFK4_UPDATE_SIGNING_KEY_PEM)) {
            throw "AFK4_UPDATE_SIGNING_KEY_PEM secret is required when publish_update_metadata=true."
          }

          $arguments = @(
            '-Version', $env:INPUT_VERSION,
            '-Channel', $env:INPUT_CHANNEL,
            '-OrganizationId', $env:INPUT_ORGANIZATION_ID,
            '-PackageDirectory', 'artifacts/client-packages',
            '-OutputDirectory', 'artifacts/update-packages',
            '-ArtifactStore', $env:INPUT_ARTIFACT_STORE,
            '-SigningKeyEnvVar', 'AFK4_UPDATE_SIGNING_KEY_PEM',
            '-ReleaseNotes', $env:INPUT_RELEASE_NOTES)

          if ($env:INPUT_ARTIFACT_STORE -eq 'file-system') {
            $arguments += @('-HostingRoot', $env:INPUT_HOSTING_ROOT)
            $arguments += @('-PublicBaseUri', $env:INPUT_PUBLIC_BASE_URI)
          }
          elseif ($env:INPUT_ARTIFACT_STORE -eq 'http-put') {
            $arguments += @('-OperatorArtifactUploadUri', $env:INPUT_OPERATOR_ARTIFACT_UPLOAD_URI)
            $arguments += @('-OperatorArtifactPublicUri', $env:INPUT_OPERATOR_ARTIFACT_PUBLIC_URI)
            $arguments += @('-GamingPcArtifactUploadUri', $env:INPUT_GAMING_PC_ARTIFACT_UPLOAD_URI)
            $arguments += @('-GamingPcArtifactPublicUri', $env:INPUT_GAMING_PC_ARTIFACT_PUBLIC_URI)
          }
          else {
            if ([string]::IsNullOrWhiteSpace($env:AFK4_UPDATE_ARTIFACTS_S3_ACCESS_KEY) -or [string]::IsNullOrWhiteSpace($env:AFK4_UPDATE_ARTIFACTS_S3_SECRET_KEY)) {
              throw "AFK4_UPDATE_ARTIFACTS_S3_ACCESS_KEY and AFK4_UPDATE_ARTIFACTS_S3_SECRET_KEY secrets are required when artifact_store=s3."
            }

            $arguments += @('-S3Endpoint', $env:INPUT_S3_ENDPOINT)
            $arguments += @('-S3Bucket', $env:INPUT_S3_BUCKET)
            $arguments += @('-S3AccessKeyEnvVar', 'AFK4_UPDATE_ARTIFACTS_S3_ACCESS_KEY')
            $arguments += @('-S3SecretKeyEnvVar', 'AFK4_UPDATE_ARTIFACTS_S3_SECRET_KEY')
            $arguments += @('-PublicBaseUri', $env:INPUT_PUBLIC_BASE_URI)
            if (-not [string]::IsNullOrWhiteSpace($env:INPUT_S3_KEY_PREFIX)) {
              $arguments += @('-S3KeyPrefix', $env:INPUT_S3_KEY_PREFIX)
            }
          }

          powershell -ExecutionPolicy Bypass -File scripts/publish-client-msi-updates.ps1 @arguments

      - name: Upload update package requests
        if: ${{ inputs.publish_update_metadata }}
        uses: actions/upload-artifact@v4
        with:
          name: afk4-update-package-requests-${{ inputs.version }}-${{ inputs.channel }}
          path: artifacts/update-packages/*-request.json
          if-no-files-found: error
          retention-days: 3

      - name: Register update packages
        if: ${{ inputs.register_update_packages }}
        shell: pwsh
        env:
          AFK4_UPDATE_REGISTRATION_TOKEN: ${{ secrets.AFK4_UPDATE_REGISTRATION_TOKEN }}
          INPUT_PLATFORM_BASE_URL: ${{ inputs.platform_base_url }}
          INPUT_BRANCH_ID: ${{ inputs.branch_id }}
          INPUT_CREATE_UPDATE_ROLLOUTS: ${{ inputs.create_update_rollouts }}
          INPUT_ROLLOUT_COMPONENT: ${{ inputs.rollout_component }}
          INPUT_ROLLOUT_TARGET_KIND: ${{ inputs.rollout_target_kind }}
          INPUT_ROLLOUT_TARGET_DEVICE_ID: ${{ inputs.rollout_target_device_id }}
          INPUT_ROLLOUT_REASON: ${{ inputs.rollout_reason }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:AFK4_UPDATE_REGISTRATION_TOKEN)) {
            throw "AFK4_UPDATE_REGISTRATION_TOKEN secret is required when register_update_packages=true."
          }

          $arguments = @(
            '-PlatformBaseUrl', $env:INPUT_PLATFORM_BASE_URL,
            '-BranchId', $env:INPUT_BRANCH_ID,
            '-RequestDirectory', 'artifacts/update-packages',
            '-AccessTokenEnvVar', 'AFK4_UPDATE_REGISTRATION_TOKEN')

          if ($env:INPUT_CREATE_UPDATE_ROLLOUTS -eq 'true') {
            $arguments += @('-CreateRollouts')
            $arguments += @('-RolloutComponent', $env:INPUT_ROLLOUT_COMPONENT)
            $arguments += @('-RolloutTargetKind', $env:INPUT_ROLLOUT_TARGET_KIND)
            if (-not [string]::IsNullOrWhiteSpace($env:INPUT_ROLLOUT_TARGET_DEVICE_ID)) {
              $arguments += @('-RolloutTargetDeviceId', $env:INPUT_ROLLOUT_TARGET_DEVICE_ID)
            }
            if (-not [string]::IsNullOrWhiteSpace($env:INPUT_ROLLOUT_REASON)) {
              $arguments += @('-RolloutReason', $env:INPUT_ROLLOUT_REASON)
            }
          }

          powershell -ExecutionPolicy Bypass -File scripts/register-update-package-requests.ps1 @arguments

      - name: Upload client packages
        uses: actions/upload-artifact@v4
        with:
          name: afk4-client-packages-${{ inputs.version }}-${{ inputs.channel }}
          path: artifacts/client-packages/*.msi
          if-no-files-found: error
          retention-days: 3
